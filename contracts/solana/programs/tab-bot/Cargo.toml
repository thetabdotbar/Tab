[package]
name = "tab-bot"
version = "0.1.0"
description = "Tab bot-driven payments on Solana — social-command P2P transfers + campaign grant distributions. Mirrors the EVM TabBotRouter."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tab_bot"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
