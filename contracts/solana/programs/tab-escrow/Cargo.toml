[package]
name = "tab-escrow"
version = "0.1.0"
description = "Tab escrow program on Solana — OpenTab (handle-based or claim-by-code) for sending stablecoin to people who don't have an account yet. Non-custodial. Mirrors the EVM TabEscrowRouter."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tab_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
