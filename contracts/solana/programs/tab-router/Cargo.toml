[package]
name = "tab-router"
version = "0.1.0"
description = "Tab payment router on Solana — gasless SPL token transfers with a 1% protocol fee, per-user unordered nonces, and a permissionless relay."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tab_router"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
